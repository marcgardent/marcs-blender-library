# Publie l'endpoint de la library distante Blender et le dépôt d'extensions sur GitHub Pages.
# Pages ne sert pas les fichiers LFS : on les récupère ici avant de déployer.
name: Endpoint Blender

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Prépare le site
        run: |
          mkdir _site
          cp -r _asset-library-meta.json _v1 blender_assets.cats.txt assets extensions _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
